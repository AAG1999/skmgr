version: 2
project_name: skmgr

# Completions and man pages are generated from the live command tree, so they
# cannot ship describing flags that no longer exist.
#
# They land in extras/ rather than dist/, because before hooks run first and
# GoReleaser then empties dist/ — output written there would not survive to the
# archive stage.
before:
  hooks:
    - go mod tidy
    - go run ./scripts/gen-dist -out extras

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      # dyld on macOS 26 refuses to load a Mach-O executable with no LC_UUID,
      # and Go only emits one by default from 1.24. Releases build with the
      # current Go, so this is belt and braces: it keeps a pinned or older
      # toolchain from silently shipping a darwin binary that cannot start.
      - -B gobuildid
      - -X github.com/AAG1999/skmgr/cmd.Version={{.Version}}

archives:
  - formats: [tar.gz]
    # Use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - src: extras/completions/*
        dst: completions
      - src: extras/man/*
        dst: man
      # dst is the destination path, not a directory, when src names a single
      # file rather than a glob — "dst: schemas" lands the schema as a file
      # called "schemas".
      - src: schemas/skmgr.schema.json
        dst: schemas/skmgr.schema.json

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

# Formulae that install prebuilt binaries are deprecated; casks are the
# supported path. After the first cask release, delete Formula/skmgr.rb from
# the tap and add tap_migrations.json so upgrades move to the cask.
homebrew_casks:
  - name: skmgr
    repository:
      owner: AAG1999
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/AAG1999/skmgr"
    description: "The framework-agnostic skill manager for AI agents"
    license: "Apache 2.0"
    completions:
      bash: completions/skmgr.bash
      zsh: completions/skmgr.zsh
      fish: completions/skmgr.fish
    manpages:
      - man/skmgr.1
    hooks:
      post:
        # Unsigned binaries need the quarantine bit cleared or Gatekeeper
        # refuses to run them after brew install --cask.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/skmgr"]
          end

release:
  extra_files:
    - glob: ./scripts/install.sh
    - glob: ./scripts/install.ps1
    # Editors reference the schema by URL, so it is attached to the release as
    # a stable, versioned artifact rather than only living on a branch.
    - glob: ./schemas/skmgr.schema.json

nfpms:
  - id: skmgr
    package_name: skmgr
    homepage: "https://github.com/AAG1999/skmgr"
    maintainer: "Abhishek Gawade <a.a.gawade1999@gmail.com>"
    description: "The framework-agnostic skill manager for AI agents"
    license: "Apache 2.0"
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin
    contents:
      - src: extras/completions/skmgr.bash
        dst: /usr/share/bash-completion/completions/skmgr
      - src: extras/completions/skmgr.zsh
        dst: /usr/share/zsh/site-functions/_skmgr
      - src: extras/completions/skmgr.fish
        dst: /usr/share/fish/vendor_completions.d/skmgr.fish
      - src: extras/man/skmgr.1
        dst: /usr/share/man/man1/skmgr.1
      - src: schemas/skmgr.schema.json
        dst: /usr/share/skmgr/skmgr.schema.json
